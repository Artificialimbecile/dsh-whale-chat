# ============================================================================
# dsh-whale-chat —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 本地开发安装（link 到源码目录）：
#   dsh plugin --profile desktop add "link:C:\Users\<你>\Desktop\whale\dsh-whale-chat"
#
# ⚠️ `name:` 必须与安装后的**包名**完全一致（这里是 dsh-whale-chat），否则表现为
#    「装上了但设置页 404 / 客户端模块不加载」。
#    `id:` 也必须与包名一致，且该行不能写行尾注释。
# ============================================================================

- insert:
    - id: dsh-whale-chat
      name: dsh-whale-chat
